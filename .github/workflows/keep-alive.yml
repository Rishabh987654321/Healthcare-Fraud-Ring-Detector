name: Keep Demo Warm

on:
  schedule:
    # Every 10 minutes. Adjust based on your host's actual sleep threshold —
    # Render's free tier sleeps after ~15 min idle, so 10 min comfortably beats it.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf https://healthcare-fraud-ring-detector.onrender.com/api/health/ || echo "Ping failed — check if backend/CognoDB is down"